<!-- BRAD HOBBS WEB DESIGN HEADER -->
<style>
#siteHeader{position:relative;z-index:1000}
.topbar{
  position:fixed;top:0;left:0;transform:none;z-index:1000;
  width:100vw;max-width:none;min-height:68px;padding:8px 5%;box-sizing:border-box;
  display:flex;align-items:center;justify-content:space-between;
  border-radius:0;
  background:rgba(5,18,40,.97);
  border:0;border-bottom:2px solid rgba(22,137,232,.55);
  box-shadow:0 5px 20px rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:10px;overflow:hidden}
.brand img{
  height:46px;width:auto;display:block;object-fit:cover;object-position:center;
  transform:scale(1.08);
  filter:drop-shadow(0 0 7px rgba(233,168,23,.42));
}
.brandText{display:flex;flex-direction:column;line-height:1.05}
.brandText strong{font-size:15px;font-weight:900;color:#fff}
.brandText span{font-size:12px;color:rgba(255,255,255,.72)}
.nav{display:flex;gap:27px;align-items:center}
.nav a{
  position:relative;color:rgba(255,255,255,.86);font-weight:700;font-size:13px;
  text-decoration:none;padding:14px 0;transition:.2s ease;
}
.nav a::after{
  content:"";position:absolute;left:0;right:0;bottom:4px;height:2px;
  transform:scaleX(0);transform-origin:center;background:#f0b529;transition:.2s ease;
}
.nav a:hover,.nav a.active{color:#fff}
.nav a:hover::after,.nav a.active::after{transform:scaleX(1)}
.menuToggle{
  display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:8px;
}
.menuToggle span{width:25px;height:3px;background:#fff;border-radius:3px}
.mobileMenu{
  position:fixed;top:0;left:-270px;width:270px;height:100%;
  background:#050a14;padding:85px 24px 30px;display:flex;flex-direction:column;gap:20px;
  transition:left .3s ease;z-index:9999;box-shadow:10px 0 35px rgba(0,0,0,.35)
}
.mobileMenu a{color:#fff;font-size:18px;text-decoration:none}
.mobileMenu a.active{color:#ffd34e}
.mobileMenu.open{left:0}
.menuOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:.3s ease;z-index:9998
}
.menuOverlay.active{opacity:1;pointer-events:auto}
.topbar.scrolled{box-shadow:0 8px 28px rgba(0,0,0,.42),0 0 15px rgba(22,137,232,.18)}
@media(max-width:1024px){.nav{display:none}.menuToggle{display:flex}}
</style>
<style id="desktop-nav-sizing">
@media(min-width:1025px){
  .topbar{
    padding-left:max(70px,calc((100vw - 1180px)/2));
    padding-right:max(70px,calc((100vw - 1180px)/2));
    min-height:70px;
  }
  .brand{gap:10px}
  .brand img{height:46px}
  .brandText strong{font-size:15px}
  .brandText span{font-size:12px}
  .nav{gap:20px}
  .nav a{font-size:13px;padding:12px 0}
}
@media(min-width:1500px){
  .nav{gap:22px}
}
</style>
