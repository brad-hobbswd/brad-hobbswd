<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Thank You | Brad Hobbs Web Design</title>
<meta name="description" content="Thank you for visiting Brad Hobbs Web Design.">

<link rel="icon" href="/brad-hobbswd/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/brad-hobbswd/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/brad-hobbswd/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/brad-hobbswd/images/favicon-180.png">

<link rel="stylesheet" href="/brad-hobbswd/style.css?v=21">

<style>
.thanksMain{
  min-height:calc(100vh - 70px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:54px 24px 70px;
}

.thanksCard{
  width:min(900px,100%);
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:22px;
  background:
    radial-gradient(700px 260px at 50% 0%,rgba(47,179,255,.18),transparent 70%),
    linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  box-shadow:0 20px 55px rgba(0,0,0,.42);
  text-align:center;
}

.thanksImage{
  width:100%;
  background:#06162d;
}

.thanksImage img{
  width:100%;
  height:auto;
  display:block;
}

.thanksContent{
  padding:38px 30px 42px;
}

.thanksEyebrow{
  margin:0 0 10px;
  color:var(--accent2);
  font-size:12px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.thanksContent h1{
  margin:0;
  color:#fff;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(32px,5vw,52px);
  line-height:1.08;
}

.thanksContent p{
  max-width:650px;
  margin:16px auto 0;
  color:var(--muted);
  font-size:16px;
  line-height:1.7;
}

.thanksActions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:27px;
}

.thanksActions .btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:0 20px;
  text-decoration:none;
}

@media(max-width:600px){
  .thanksMain{
    min-height:calc(100vh - 64px);
    padding:30px 15px 45px;
  }

  .thanksCard{
    border-radius:18px;
  }

  .thanksContent{
    padding:30px 20px 34px;
  }

  .thanksContent p{
    font-size:15px;
  }

  .thanksActions{
    flex-direction:column;
  }

  .thanksActions .btn{
    width:100%;
  }
}
</style>
</head>

<body data-page="thanks">

<div class="wrap">

<header id="siteHeader"></header>

<main class="thanksMain">
  <section class="thanksCard" aria-labelledby="thanksTitle">

    <div class="thanksImage">
      <img
        src="/brad-hobbswd/images/1D331F01-1958-4597-B880-70521DBF6288.png"
        alt="Thank you from Brad Hobbs Web Design">
    </div>

    <div class="thanksContent">
      <div class="thanksEyebrow">Brad Hobbs Web Design</div>

      <h1 id="thanksTitle">Thank You</h1>

      <p>
        Thank you for visiting Brad Hobbs Web Design. Your interest, support,
        and time are genuinely appreciated.
      </p>

      <p>
        When you're ready, continue exploring the site or return to the
        homepage.
      </p>

      <div class="thanksActions">
        <a href="/brad-hobbswd/" class="btn btnPrimary">Return Home</a>
        <a href="/brad-hobbswd/service.html" class="btn">Explore Services</a>
      </div>
    </div>

  </section>
</main>

<div id="siteFooter"></div>

</div>

<script src="/brad-hobbswd/layout.js"></script>
</body>
</html>
