<style>
:root{--c-navy:#07162d;--c-blue:#1689e8;--c-gold:#e9a817;--c-ink:#12233f;--c-muted:#596a82;--c-light:#f4f7fb;--c-line:#dbe4ee}
body[data-page="contact"]{padding-top:0!important;background:var(--c-light);color:var(--c-ink)}
body[data-page="contact"] .wrap{width:100%;max-width:none;margin:0;padding:0}
body[data-page="contact"] #siteHeader{height:70px;position:relative}
body[data-page="contact"] main{width:100%;margin:0;padding:0}
body[data-page="contact"] .bannerSection{margin:0;background:#061327;line-height:0}
body[data-page="contact"] .bannerCard{display:block;width:100%;margin:0;border:0;border-radius:0;overflow:hidden;background:#061327;box-shadow:none}
body[data-page="contact"] .bannerCard img{width:100%;height:auto;display:block}
body[data-page="contact"] .bannerSection:nth-of-type(2) .bannerCard{cursor:pointer}
body[data-page="contact"] .bannerSection:nth-of-type(2) .bannerCard:hover{filter:brightness(1.04)}
body[data-page="contact"] .sectionDivider{width:min(900px,88%);height:1px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--c-blue),var(--c-gold),transparent)}
.serviceText{background:#fff;width:100%;max-width:none;margin:0;padding:68px 0;text-align:center}
.serviceText h2{width:92%;margin:0 auto;font-family:Georgia,"Times New Roman",serif;color:var(--c-ink);font-size:clamp(34px,4.5vw,52px);line-height:1.08}
.serviceText p{width:min(700px,92%);margin:15px auto 0;color:var(--c-muted);line-height:1.7;font-size:16px}
.contactWrap{width:100%;box-sizing:border-box;margin:0;padding:72px 0;background:var(--c-light);display:flex;justify-content:center}
#quoteForm.card{box-sizing:border-box;width:min(760px,92%);max-width:none;margin:0;padding:34px;border-radius:15px;background:#fff;border:1px solid var(--c-line);box-shadow:0 20px 48px rgba(18,42,72,.11)}
.formTitle{text-align:center;margin:0;color:var(--c-ink);font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,4vw,46px);line-height:1.08}
.formSubtitle{color:var(--c-muted)}
.formGrid{display:grid;gap:21px;margin-top:28px}
.formLabel{display:block;text-align:left}
.formLabelTitle{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;color:#164c80}
.formControl{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:8px;border:1px solid #ccd8e5;background:#fff;color:var(--c-ink);font:inherit}
.formControl::placeholder{color:#8796aa}
.formControl:focus{outline:none;border-color:var(--c-blue);box-shadow:0 0 0 3px rgba(22,137,232,.12)}
.formControl option{background:#fff;color:var(--c-ink)}
.formLabel textarea{min-height:150px;resize:vertical}
#sendBtn{width:100%;min-height:50px;margin-top:3px;border-radius:7px;font-weight:900}
body[data-page="contact"] .footerDivider{display:none!important}
@media(max-width:600px){
 body[data-page="contact"] #siteHeader{height:64px}
 .serviceText{padding:52px 0}.serviceText h2{font-size:38px}.serviceText p{font-size:15px}
 .contactWrap{padding:52px 0}
 #quoteForm.card{width:92%;padding:23px 18px}
 .formTitle{font-size:37px}
 .formGrid{gap:18px;margin-top:24px}
}
</style>

<body data-page="contact">

<div class="wrap">

<header id="siteHeader"></header>

<main>

<section class="bannerSection">
  <div class="bannerCard">
    <img src="images/27229CBD-3947-480E-AB39-1D9CC6B3202E.png" alt="Contact">
  </div>
</section>

<div class="sectionDivider"></div> <!-- ADD THIS -->

<section class="bannerSection">
  <a href="mailto:brad.hobbs13@icloud.com" class="bannerCard">
    <img src="images/40411AF9-F914-4D71-AA94-30A89AC34E14.png" alt="Email First Communication">
  </a>
</section>

<div class="sectionDivider"></div>

<section class="serviceText">
  <h2>Direct Contact with Clarity</h2>
  <p>Click the banner above to open a ready to send email.</p>
  <p>A response is provided within 24 hours.</p>
</section>

<div class="sectionDivider"></div>

<section class="contactWrap">

<form 
id="quoteForm"
class="card contactForm"
method="POST"
target="hidden_iframe"
action="https://docs.google.com/forms/d/e/1FAIpQLSdBbVTznNfzNn8KuLN6IA3fsdxgC4MPw9ryoTQK5fJ4K0bFuA/formResponse">

<div class="formTitle">Send a Message</div>

<div class="formGrid">

<label class="formLabel">
<div class="formLabelTitle">Name</div>
<input name="entry.2005620554" required class="formControl">
</label>

<label class="formLabel">
<div class="formLabelTitle">Email</div>
<input name="entry.1045781291" type="email" required class="formControl">
</label>

<label class="formLabel">
<div class="formLabelTitle">Project Type</div>

<select name="entry.1065046570" class="formControl" required>
<option value="" disabled selected>Select a project type</option>
<option value="Starter Website Package">Starter Website Package</option>
<option value="Business Website Package">Business Website Package</option>
<option value="Custom Project">Custom Project</option>
<option value="General Question">General Question</option>
</select>

</label>

<label class="formLabel">
<div class="formLabelTitle">Message</div>
<textarea 
  name="entry.1166974658" 
  rows="4" 
  required 
  class="formControl">
</textarea>
</label>

<button id="sendBtn" class="btn btnPrimary">Send Message</button>

</div>

</form>

<iframe name="hidden_iframe" style="display:none;"></iframe>

</section>

</main>

<div class="sectionDivider footerDivider"></div>
<div id="siteFooter"></div>

</div>

<script src="/brad-hobbswd/layout.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){

  const form = document.querySelector(".contactForm");
  const iframe = document.querySelector('iframe[name="hidden_iframe"]');

  if(!form || !iframe) return;

  let submitted = false;

  form.addEventListener("submit", function(){
    const btn = document.getElementById("sendBtn");
    if(btn){
      btn.disabled = true;
      btn.textContent = "Sending...";
    }
    submitted = true;
  });

  iframe.addEventListener("load", function(){
    if(submitted){
      window.location.href = "thanks.html";
    }
  });

});
</script>
